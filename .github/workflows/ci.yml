name: compliance-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app samples scripts tests
      - name: Run compliance tests
        env:
          WEB_SEARCH_ENABLED: "false"
          APP_STORAGE_DIR: ${{ runner.temp }}/document-ppt-storage
        run: python -m unittest discover -s tests -v
      - name: Run deterministic demo
        env:
          WEB_SEARCH_ENABLED: "false"
          APP_STORAGE_DIR: ${{ runner.temp }}/document-ppt-demo
        run: python scripts/run_demo.py
